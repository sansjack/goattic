name: Release Client

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  fetch-ffmpeg:
    name: Fetch ffmpeg binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all ffmpeg binaries
        run: make fetch-ffmpeg-all

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bins
          path: client/internal/ffmpeg/bin/

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: fetch-ffmpeg
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: goattic-linux-amd64
          - goos: darwin
            goarch: amd64
            artifact: goattic-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: goattic-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: goattic-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-bins
          path: client/internal/ffmpeg/bin/

      - name: Restore permissions
        run: chmod +x client/internal/ffmpeg/bin/ffmpeg-linux-amd64 client/internal/ffmpeg/bin/ffmpeg-darwin-* || true

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Build
        working-directory: client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -trimpath -o ${{ matrix.artifact }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Remove ffmpeg-bins from release artifacts
        run: rm -rf artifacts/ffmpeg-bins

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
